qlib_init:
    # 数据路径配置
    # 注意：此路径应与 config/paths.yaml 中的 provider_uri 保持一致
    # 修改数据路径后，运行以下命令自动同步：
    #   python qlib_code/sync_provider_uri.py
    # 或使用 update_yaml.py 更新（会同时更新模型参数）：
    #   python qlib_code/update_yaml.py
    provider_uri: "E:\\qlib_data\\tushare_qlib_data\\qlib_bin"
    region: cn
market: &market all
benchmark: &benchmark 000300.sh
data_handler_config: &data_handler_config
    start_time: 2023-01-01
    end_time: 2023-03-02
    fit_start_time: 2023-01-01
    fit_end_time: 2023-02-24  # 与训练集结束时间一致
    instruments: *market
    
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
            risk_degree: 1.0
    backtest:
        start_time: 2023-03-01
        end_time: 2023-03-02
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
            trade_unit: 1
task:
    experiment_name: "test_lgbm"
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.6754969498504872
            learning_rate: 0.4032304577628365
            subsample: 0.6224471360862527
            lambda_l1: 459.3881848268278
            lambda_l2: 0.1364400973379037
            num_leaves: 540
            feature_fraction: 0.8841478314373719
            bagging_fraction: 0.9626984841763665
            bagging_freq: 1
            min_data_in_leaf: 21
            min_child_samples: 48
            max_depth: 10
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2023-01-01, 2023-02-24]
                valid: [2023-02-27, 2023-02-28]
                test: [2023-03-01, 2023-03-02]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
      
       
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
