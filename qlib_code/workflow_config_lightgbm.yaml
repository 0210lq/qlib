qlib_init:
    provider_uri: "D:/qlib_data/tushare_qlib_data/qlib_bin"
    region: cn
market: &market all
benchmark: &benchmark 000300.sh
data_handler_config: &data_handler_config
    start_time: 2017-06-30
    end_time: 2025-07-01
    fit_start_time: 2017-06-30
    fit_end_time: 2025-06-25
    instruments: *market

port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
            risk_degree: 1.0
    backtest:
        start_time: 2025-06-28
        end_time: 2025-06-29
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
            trade_unit: 1
task:
    experiment_name: "test_lgbm"
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.7578788098176714
            learning_rate: 0.6195887524161012
            subsample: 0.5685220203317624
            lambda_l1: 1654.9003005628074
            lambda_l2: 0.013447931810022256
            num_leaves: 46
            feature_fraction: 0.8850875364946033
            bagging_fraction: 0.7500426173728267
            bagging_freq: 5
            min_data_in_leaf: 32
            min_child_samples: 14
            max_depth: 10
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2017-06-30, 2025-06-25]
                valid: [2025-06-26, 2025-06-27]
                test: [2025-06-30, 2025-07-01]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
      
       
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
