qlib_init:
    provider_uri: "../qlib_data/qlib_bin"
    region: cn
market: &market all
benchmark: &benchmark 000300.sh
data_handler_config: &data_handler_config
    start_time: 2023-01-01
    end_time: 2026-01-09
    fit_start_time: 2023-01-01
    fit_end_time: 2026-01-05
    instruments: *market
    
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
            risk_degree: 1.0
    backtest:
        start_time: 2026-01-08
        end_time: 2026-01-09
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
            trade_unit: 1
task:
    experiment_name: "test_lgbm"
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8844312925041713
            learning_rate: 0.34389420163873474
            subsample: 0.08377779110301342
            lambda_l1: 0.058431447025967656
            lambda_l2: 35.42300072397281
            num_leaves: 775
            feature_fraction: 0.7195004122657256
            bagging_fraction: 0.6448954268663576
            bagging_freq: 7
            min_data_in_leaf: 22
            min_child_samples: 63
            max_depth: 10
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2023-01-01, 2026-01-05]
                valid: [2026-01-06, 2026-01-07]
                test: [2026-01-08, 2026-01-09]
    record: 
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            model: <MODEL>
            dataset: <DATASET>
      
       
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs: 
            config: *port_analysis_config
