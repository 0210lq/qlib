# ============================================================================
# SQL2CSV 数据导出配置
# ============================================================================
# 使用说明：
# 1. 此配置文件用于 sql2csv.py 脚本的参数配置
# 2. 修改参数后，重新运行脚本即可生效
# 3. 支持使用环境变量（如 ${HOME}、${USERPROFILE}）和路径变量（如 ${base_dir}）
# ============================================================================

# ============================================================================
# 输出路径配置
# ============================================================================
# csv_output_dir: CSV 数据输出目录
# 说明：
#   - 指定导出的 CSV 文件存放路径
#   - 支持相对路径（相对于项目根目录）和绝对路径
#   - 支持使用环境变量和路径变量（如 ${base_dir}）
#   - 示例：
#     - 相对路径: "../qlib_data/csv_data"
#     - 绝对路径: "D:/qlib_data/csv_data"
#     - 使用变量: "${base_dir}/csv_data"
# ============================================================================
csv_output_dir: "${base_dir}/csv_data"

# ============================================================================
# 市场类型配置
# ============================================================================
# market: 指定要处理的股票池类型
# 可选值：
#   - 'ALL': 处理所有股票
#   - 'zz500': 中证500指数成分股
#   - 'hs300': 沪深300指数成分股
#   - 'sz50': 上证50指数成分股
#   - 'zz1000': 中证1000指数成分股
#   - 'zz2000': 中证2000指数成分股
# 说明：用于从数据库获取指定股票池的股票列表，并处理这些股票的数据
# ============================================================================
market: "ALL"

# ============================================================================
# 日期范围配置
# ============================================================================
# start_date: 数据提取的起始日期
# 格式：'YYYYMMDD'（例如：'20150101'）
# 说明：指定从哪个日期开始提取股票和指数数据
#       建议设置为足够早的日期，以确保获取完整的历史数据
# ============================================================================
start_date: "20150101"

# ============================================================================
# end_date: 数据提取的结束日期
# 格式：'YYYYMMDD'（例如：'20241231'）或 null
# 说明：
#   - 如果设置为 null 或空值，将自动使用当前日期作为结束日期
#   - 如果设置为具体日期，将提取到该日期为止的数据
#   - 建议设置为 null，以便自动获取最新数据
# ============================================================================
end_date: null

# ============================================================================
# 批处理配置
# ============================================================================
# batch_size: 批处理大小
# 说明：
#   - 指定每次批量处理股票的数量
#   - 较大的值可以提高处理速度，但会占用更多内存
#   - 较小的值可以降低内存占用，但处理速度较慢
#   - 建议值：500-2000，根据系统内存和数据库性能调整
#   - 默认值：1000
# ============================================================================
batch_size: 1000

