# 路径配置示例文件
# 使用说明：
# 1. 复制此文件为 paths.yaml: cp paths.example.yaml paths.yaml
# 2. 根据实际环境修改路径配置
# 3. 支持使用环境变量（如 ${HOME}、${USERPROFILE}）
# 4. 支持相对路径（相对于项目根目录）

# ============================================
# 基础目录配置
# ============================================

# 数据存储基础目录
# 示例（推荐使用相对路径）：
#   - Linux/Mac: "../qlib_data" 或 "${HOME}/qlib_data"
#   - Windows: "..\\qlib_data" 或 "${USERPROFILE}\\qlib_data"
base_dir: "../qlib_data"

# ============================================
# CSV 数据目录
# ============================================

# 存放 CSV 版本数据
csv_output_dir: "${base_dir}/csv_data"

# 存放每日更新需要的 CSV 数据
csv_daily_dir: "${base_dir}/daily"

# ============================================
# Qlib 相关路径
# ============================================

# Qlib 二进制数据存储路径
provider_uri: "${base_dir}/qlib_bin"

# Qlib 仓库路径
# 注意：qlib 已包含在项目中，使用项目内的相对路径
# 如果需要使用外部 qlib，可以修改为：
#   - 相对路径（项目外）: "../qlib"
#   - Linux/Mac: "${HOME}/qlib"
#   - Windows: "${USERPROFILE}\\qlib"
qlib_workdir: "./qlib"

# ============================================
# 模型相关路径
# ============================================

# 训练好的模型存放路径
# 可以使用相对路径或绝对路径
# 示例：
#   - 相对路径: "./models/trained_model"
#   - 绝对路径: "${base_dir}/models/trained_model"
model_path: "${base_dir}/models/trained_model"

# 预测结果（score 文件）存放路径
prediction_output_dir: "${base_dir}/output/prediction"

# ============================================
# 临时和处理目录
# ============================================

# 临时存放合并后的优化后的权重文件
temp_dir: "${base_dir}/temp"

# 输出的优化结果存放路径
processing_data_dir: "${base_dir}/processing"

# ============================================
# 配置文件路径
# ============================================

# 模型配置文件路径（相对于项目根目录）
yaml_path: "./qlib_code/workflow_config_lightgbm.yaml"

# ============================================
# Python 执行路径
# ============================================

# Python 可执行文件路径
# 注意：
#   - 如果使用 conda 环境，激活环境后通常无需指定此路径
#   - 如果 MATLAB 调用 Python，需要指定完整路径
#   - 可以使用 "python" 让系统自动查找当前激活环境的 Python
#
# 示例：
#   - 自动检测: "python"
#   - Windows Conda: "${USERPROFILE}\\anaconda3\\envs\\qlib_env\\python.exe"
#   - Linux/Mac Conda: "${HOME}/anaconda3/envs/qlib_env/bin/python"
python_exe: "python"

# ============================================
# MATLAB 相关路径
# ============================================

# YAML MATLAB 工具路径（相对路径）
yaml_matlab: "./YAMLMatlab_0.4.3"

# 全局工具配置
global_tools: "GLOBAL_TOOLSFUNC"
